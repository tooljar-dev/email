# The daily data job: rebuild the lists, check, commit, deploy, then test the live site.
# Nothing is committed or deployed when the data did not change or when any check fails.
name: data
on:
  schedule:
    - cron: "17 3 * * *" # every day at 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Rebuild the data
        run: npm run data
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Did anything change?
        id: diff
        run: |
          if git diff --quiet -- data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the site with the new data
        if: steps.diff.outputs.changed == 'true'
        run: npm run check
      - name: Commit the data
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore(data): daily update $(date -u +%F)"
          git push
      - name: Deploy (versions only; DNS and routes are never touched)
        if: steps.diff.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          tag="data-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          npx wrangler versions upload --config wrangler.jsonc --tag "$tag" --message "daily data $(date -u +%F)"
          npx wrangler versions deploy --config wrangler.jsonc --version-tag "$tag" --percentage 100 --yes --message "daily data $(date -u +%F)"
      - name: Test the live site
        if: steps.diff.outputs.changed == 'true'
        run: npm run smoke
